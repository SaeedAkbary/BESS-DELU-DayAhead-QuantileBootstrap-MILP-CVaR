# Download real historical prices for BESS training and evaluation.
name: Download DE-LU price history

# Run when this workflow is created or modified.
on:
  push:
    paths:
      - ".github/workflows/fetch_history.yml"
      - "history.py"
  workflow_dispatch:

# Read-only repository access; never commit price data automatically.
permissions:
  contents: read

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      # Check out the source.
      - name: Checkout code
        uses: actions/checkout@v4

      # Set up Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Install required packages.
      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      # Test DST handling and data validation before downloading.
      - name: Test validation
        run: python -m unittest -v tests.test_data

      # Download month by month; stop on any incomplete month.
      - name: Fetch historical prices
        run: python history.py

      # Preserve already validated months even if a later month fails.
      - name: Save validated CSV files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: DE-LU-validated-months
          path: output/
          if-no-files-found: warn
