name: Benchmark battery strategies across October 2026
on:
  push:
    branches:
      - feature/battery-optimization-foundation
    paths:
      - battery_october_benchmark.py
      - .github/workflows/benchmark_battery_october.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyomo highspy
      - name: Download validated historical data
        uses: actions/download-artifact@v4
        with:
          name: DE-LU-validated-months
          run-id: 42305243042
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: input/
      - name: Run October multi-day benchmark
        run: |
          python battery_october_benchmark.py \
            --history input/prices_DE-LU_2025-10_to_2026-10.csv \
            --capacity-mwh 2 --power-mw 1 \
            --eta-charge 0.95 --eta-discharge 0.95 \
            --initial-mwh 1 --risk-weight 1 --alpha 0.95 \
            --output output/battery_october_benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: battery-october-benchmark-illustrative
          path: output/battery_october_benchmark.json
          if-no-files-found: error
