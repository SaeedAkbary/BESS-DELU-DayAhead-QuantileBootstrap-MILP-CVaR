name: Enforce English-only repository text

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  english-only:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reject non-English Arabic-script text
        run: python check_english_only.py
      - name: Check Python syntax
        run: python -m compileall -q .
