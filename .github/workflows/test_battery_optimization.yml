name: Test battery optimization MILP

on:
  push:
    branches:
      - feature/battery-optimization-foundation
      - refactor/project-layout
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'tests/**'
      - '*.py'
      - 'requirements.txt'
      - '.github/workflows/**'
  workflow_dispatch:

jobs:
  battery-milp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install MILP dependencies
        run: python -m pip install -r requirements.txt
      - name: Run full test suite
        run: python -m unittest discover -s tests -t . -v
