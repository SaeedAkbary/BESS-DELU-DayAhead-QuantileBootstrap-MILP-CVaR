name: October CVaR risk sensitivity
on:
  push:
    branches:
      - feature/battery-optimization-foundation
    paths:
      - battery_risk_sensitivity.py
      - .github/workflows/battery_risk_sensitivity.yml
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  sensitivity:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyomo highspy
      - name: Download validated historical prices
        uses: actions/download-artifact@v4
        with:
          name: DE-LU-validated-months
          run-id: 42305243042
          repository: ${{ github.repository }}
          github-token: ${{ github.token }}
          path: input/
      - name: Compare five CVaR risk weights on the same scenarios
        run: |
          python battery_risk_sensitivity.py \
            --history input/prices_DE-LU_2025-10_to_2026-10.csv \
            --output output/battery_risk_sensitivity.json
      - uses: actions/upload-artifact@v4
        with:
          name: battery-risk-sensitivity-illustrative
          path: output/battery_risk_sensitivity.json
          if-no-files-found: error
